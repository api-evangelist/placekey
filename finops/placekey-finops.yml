description: >-
  FinOps view of Placekey API spend. Placekey bills on annual subscription
  plans (Free, Silver, Gold, Enterprise) sized by lookup allowance rather than
  pure usage metering. The primary cost driver is the number of Placekey
  lookups consumed against the plan's daily or annual allowance, across both the
  single (/placekey) and bulk (/placekeys) endpoints.
notes: >-
  Plan prices and lookup allowances are subject to change; verify against the
  Placekey pricing page during reconciliation.
sources:
- https://www.placekey.io/pricing
- https://docs.placekey.io/documentation/placekey-api/quick-start
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Placekey
serviceCategory: Location and Mapping
billingModel:
  pricingCategory: Subscription
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: Placekey API
  ServiceCategory: Location and Mapping
  ProviderName: Placekey
  PublisherName: Placekey
  InvoiceIssuerName: Placekey
