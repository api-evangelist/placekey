meters:
- name: lookups
  description: Placekey lookups consumed against the plan allowance across single and bulk endpoints.
  unit: lookups
  aggregation: sum
  dimensions:
  - account
  - endpoint
- name: bulk_requests
  description: Bulk requests issued to POST /placekeys, each containing up to 100 queries.
  unit: requests
  aggregation: sum
  dimensions:
  - account
- name: plan_subscription
  description: Annual subscription charge for the selected Placekey plan tier.
  unit: subscription
  aggregation: sum
  dimensions:
  - account
  - plan
principles:
- name: Visibility
  description: Track lookup volume against the plan's daily/annual allowance to anticipate tier upgrades.
- name: Allocation
  description: Tag API keys per workload/team and attribute lookups to internal cost centers.
- name: Optimization
  description: Use the bulk endpoint (up to 100 queries per request) and cache resolved Placekeys to avoid repeat lookups for the same place.
- name: Accountability
  description: Assign plan ownership and review lookup consumption against the annual allowance before renewal.
