  properties:
  - url: https://docs.placekey.io/documentation/placekey-api/quick-start
    type: Documentation
  - url: https://docs.placekey.io/documentation/placekey-api/response
    type: APIReference
  - url: openapi/placekey-openapi.yml
    type: OpenAPI
  - url: collections/placekey.postman_collection.json
    type: PostmanCollection
  - url: collections/placekey.opencollection.json
    type: OpenCollection
  description: Resolves a single address, point-of-interest, or latitude/longitude
    coordinate pair into a universal Placekey identifier via POST /placekey, using
    the apikey header for authentication.
- aid: placekey:placekey-bulk-lookup-api
  name: Placekey Bulk Lookup API
  tags:
  - Bulk
  - Batch
  - Address Matching
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.placekey.io/documentation/placekey-api/bulk-api
  baseURL: https://api.placekey.io/v1
  properties:
  - url: https://docs.placekey.io/documentation/placekey-api/bulk-api
    type: Documentation
  - url: https://docs.placekey.io/documentation/placekey-api/response
    type: APIReference
  - url: openapi/placekey-openapi.yml
    type: OpenAPI
  - url: collections/placekey.postman_collection.json
    type: PostmanCollection
  - url: collections/placekey.opencollection.json
    type: OpenCollection
  description: Resolves up to 100 queries per request into Placekey identifiers via
    POST /placekeys, with an optional per-query query_id echoed back; all queries
    in a batch must share the same iso_country_code.
