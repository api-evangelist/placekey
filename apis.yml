aid: placekey
url: https://raw.githubusercontent.com/api-evangelist/placekey/refs/heads/main/apis.yml
name: Placekey
kind: company
description: Placekey is a free, universal identifier for any physical place, designed
  to make it easy to join and match address and point-of-interest data across disparate
  datasets. The Placekey API resolves an address or latitude/longitude into a single
  Placekey, supporting both single and bulk (up to 100 per batch) lookups for address
  matching, deduplication, and data enrichment.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Location
- Geocoding
- Address Matching
- Identifiers
- POI
created: '2026-06-21'
modified: '2026-06-21'
specificationVersion: '0.19'
apis:
- aid: placekey:placekey-lookup-api
  name: Placekey Lookup API
  tags:
  - Lookup
  - Address Matching
  - Geocoding
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.placekey.io/documentation/placekey-api/quick-start
