specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Placekey
providerId: placekey
created: '2026-06-21'
modified: '2026-06-21'
reconciled: false
tags:
- Location
- Geocoding
- Address Matching
- Identifiers
- POI
- Plans
description: >-
  The Placekey identifier itself is free and open to use. The Placekey API is
  offered on a free plan plus annual paid tiers (Silver, Gold, Enterprise) that
  scale by lookup volume. The free plan provides up to 10,000 lookups per day
  with email support; paid plans raise annual lookup allowances and add bulk
  upload and faster support SLAs.
notes: >-
  Tier names, annual lookup allowances, and prices reflect publicly listed
  Placekey API pricing and are subject to change; verify on the Placekey
  pricing page during reconciliation.
sources:
- https://www.placekey.io/pricing
- https://docs.placekey.io/documentation/placekey-api/quick-start
plans:
- id: placekey-free
  name: Free
  type: free
  description: >-
    Free Placekey API access for evaluation and lower-volume use, including the
    free universal Placekey identifier.
  entries:
  - label: Daily Lookups
    name: free_lookups
    type: usage
    metric: lookups
    limit: 10000
    timeFrame: day
    geo: global
    unit: 1
    price: free
    userMultiplied: false
  elements:
  - name: Single Lookup
  - name: Bulk Lookup
  - name: Email Support
- id: placekey-silver
  name: Silver
  type: paid
  description: >-
    Entry paid tier with a higher annual lookup allowance, bulk upload, and a
    3-business-day support SLA.
  entries:
  - label: Annual Lookups
    name: silver_lookups
    type: usage
    metric: lookups
    limit: 6000000
    timeFrame: year
    geo: global
    unit: 1
    price: $2,400 per year
    userMultiplied: false
  elements:
  - name: Single Lookup
  - name: Bulk Lookup
  - name: Bulk Upload
  - name: Support (3 business days)
- id: placekey-gold
  name: Gold
  type: paid
  description: >-
    Higher-volume paid tier with bulk upload and a 1-business-day support SLA.
  entries:
  - label: Annual Lookups
    name: gold_lookups
    type: usage
    metric: lookups
    limit: 30000000
    timeFrame: year
    geo: global
    unit: 1
    price: $12,000 per year
    userMultiplied: false
  elements:
  - name: Single Lookup
  - name: Bulk Lookup
  - name: Bulk Upload
  - name: Support (1 business day)
- id: placekey-enterprise
  name: Enterprise
  type: enterprise
  description: >-
    Custom high-volume agreement with 30M+ annual lookups, bulk upload, and a
    dedicated account manager. Contact Placekey sales.
  entries:
  - label: Annual Lookups
    name: enterprise_lookups
    type: usage
    metric: lookups
    limit: -1
    timeFrame: year
    geo: global
    unit: 1
    price: from $36,000 per year
    userMultiplied: false
  elements:
  - name: Custom Volume Pricing
  - name: Bulk Upload
  - name: Dedicated Account Manager
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
